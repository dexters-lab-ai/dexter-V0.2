version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production  # Use production stage for prod environment
    container_name: katzlife-app
    restart: unless-stopped
    ports:
      - "3000:3000"    # Main application port
      - "3090:3090"    # Admin port
      - "8080:8080"    # Dashboard port
      - "80:80"        # Public port (for production)
    environment:
      # Application settings
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_PORT=3090
      - DASHBOARD_PORT=8080
      # Database configuration
      - MONGODB_URI=mongodb://mongodb:27017/katzlife
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=0

      # Performance
      - NODE_OPTIONS=--max_old_space_size=4096
      # API Credentials
      - GOOGLE_API_KEY_FILE=/usr/src/app/config/katz-speech-to-text-key.json
    working_dir: /usr/src/app
    tty: true  # Keeps container running for debugging
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: katzlife
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "'db.runCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your_secure_password}
    command: redis-server --requirepass $${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # Optional: Add mongo-express for database management
  mongo-express:
    image: mongo-express:1.0.0
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
