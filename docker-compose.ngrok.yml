version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.ngrok
    container_name: katz-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4040:4040"  # Ngrok web interface
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NGROK_ENABLED=true
      - NGROK_PORT=3000
      - NGROK_AUTH_TOKEN=${NGROK_AUTH_TOKEN}
      - NGROK_REGION=us
      - NGROK_SUBDOMAIN=${NGROK_SUBDOMAIN}
      # Add other environment variables from your .env file as needed
      - MONGO_URI=${MONGO_URI}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if(r.statusCode !== 200) throw new Error()}).on('error', (e) => {process.exit(1)})]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - katz-network

  # Add other services like MongoDB, Redis, etc.
  mongo:
    image: mongo:6
    container_name: katz-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-example}
    networks:
      - katz-network

  redis:
    image: redis:7-alpine
    container_name: katz-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - katz-network

volumes:
  mongo_data:
  redis_data:

networks:
  katz-network:
    driver: bridge
